[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-slide-detection"
version = "0.1.0"
description = "Automatically detect and extract slides from conference videos"
authors = [
    {name = "deepthought", email = "deepthought@postech.ac.kr"},
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scikit-image>=0.21.0",
    "psutil>=5.9.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
slide-extract = "slide_capture.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_capture"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
